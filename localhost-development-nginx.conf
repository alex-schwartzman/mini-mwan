# Development proxy for LuCI app development
#
# Purpose: Serves local JavaScript files while proxying all other requests to the target router.
# This allows rapid development without copying files to the router on every change.
#
# Usage:
#   1. Update the 'router' upstream below with your router's hostname/IP
#   2. Start: make nginx
#   3. Access: http://localhost:8080
#   4. Edit local files and refresh browser to see changes immediately
#   5. Stop: killall -9 nginx
#
# CONFIGURATION: Set your router hostname/IP here
# ================================================

worker_processes  1;
pid   ./nginx-run/run/nginx.pid;
error_log  ./nginx-run/logs/error.log info;

events {
  worker_connections 1024;
}

http {
  error_log  ./nginx-run/logs/error.log info;
  log_format dev_local '$request_uri $upstream_addr  $request_filename';
  access_log ./nginx-run/logs/access.log dev_local;
  client_body_temp_path ./nginx-run/client_body_temp;
  proxy_temp_path       ./nginx-run/proxy_temp;
  fastcgi_temp_path     ./nginx-run/fastcgi_temp;
  uwsgi_temp_path       ./nginx-run/uwsgi_temp;
  scgi_temp_path       ./nginx-run/scgi_temp;

  # Target router configuration - CHANGE THIS to match your router
  upstream router {
    server asusrouter:80;
  }

  server {
    listen 8080;
    server_name localhost;

    # Preserve Host header so LuCI CSRF/session checks keep working
    # IMPORTANT: This must match your router's hostname (same as upstream above)
    proxy_set_header Host asusrouter;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $http_connection;
    proxy_buffering off;

    location ~ ^/luci-static/resources/view/mini-mwan/(overview|status)\.js$ {
        alias /Users/slavibor/vscode/mini-mwan/luci-app-mini-mwan/htdocs/luci-static/resources/view/mini-mwan/$1.js;
        add_header Cache-Control "no-cache, must-revalidate";
        add_header X-Served-By "local";
        default_type application/javascript;
    }

    # redirect request for http://localhost:8081/ -> /cgi-bin/luci/admin/network/network/
    location = / {
    return 301 /cgi-bin/luci/admin/network/network/;
    }

    # Everything else proxies to the router (uses upstream definition above)
    location / {
      proxy_pass http://router/;
    }
  }
}
